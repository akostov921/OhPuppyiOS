name: OhPuppy
options:
  bundleIdPrefix: com.ohpuppy
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_TEAM: ""
targets:
  OhPuppy:
    type: application
    platform: iOS
    sources:
      - OhPuppy
    settings:
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UIStatusBarStyle: ""
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "За да ти покажем близки кучета и сигнали за изгубени."
      INFOPLIST_KEY_NSCameraUsageDescription: "За снимки на кучето ти."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "За качване на снимки."
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: 1
      GENERATE_INFOPLIST_FILE: true
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
